spring:
  application:
    name: api-gateway
server:
  port: 8080
  cloud:
    gateway:
      routes:
        # Rota para o Serviço de Usuários (Autenticação)
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**, /api/auth/**

        # Rota para o Serviço de Alunos
        - id: student-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/students/**

        # Rota para o Serviço de Professores
        - id: teacher-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/teachers/**

        # Rota para o Serviço de Notas/Presenças
        - id: academic-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/academic/**
            
      # Configuração global de CORS para permitir que o Frontend (React) faça requisições
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"