server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: professor-service
  datasource:
    url: jdbc:postgresql://postgres:5432/distrischool_db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
