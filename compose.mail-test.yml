services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - distrischool-net

  auth-service:
    environment:
      SPRING_PROFILES_ACTIVE: smtp-notifications
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      SMTP_FROM: contas@distrischool.test
    depends_on:
      mailpit:
        condition: service_started
