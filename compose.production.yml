services:
  frontend:
    build: ./frontend
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Informe o dominio publico}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://api-gateway:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - distrischool-net

  api-gateway:
    environment:
      JWT_SECRET: ${JWT_SECRET:?Informe o segredo JWT}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-https://${PUBLIC_DOMAIN:?Informe o dominio publico}}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    restart: unless-stopped

  auth-service:
    environment:
      SPRING_PROFILES_ACTIVE: ${DEPLOY_AUTH_PROFILES:-production}
      APP_SEED_DEMO_USERS: "false"
      SEED_PASSWORD: ${SEED_PASSWORD:?Informe a senha inicial}
      NOTIFICATION_LOOKUP_KEY: ${NOTIFICATION_LOOKUP_KEY:?Informe a chave interna de notificacoes}
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Informe a senha do PostgreSQL}
    restart: unless-stopped

  auth-db:
    environment:
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?Informe a senha do PostgreSQL de autenticacao}
    restart: unless-stopped

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Informe a senha do RabbitMQ}
    restart: unless-stopped

  aluno-service:
    restart: unless-stopped
  professor-service:
    restart: unless-stopped
  attendance-service:
    restart: unless-stopped
  turma-service:
    restart: unless-stopped
  nota-service:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
