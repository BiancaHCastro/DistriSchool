services:
  # Banco de Dados Relacional Principal
  postgres:
    image: postgres:15
    container_name: distrischool-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: distrischool_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - distrischool-net

  # Banco de Dados NoSQL (Opcional, listado na arquitetura para microsserviços específicos)
  mongodb:
    image: mongo:6
    container_name: distrischool-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - distrischool-net

  # RabbitMQ (Com interface gráfica de gerenciamento na porta 15672)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: distrischool-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - distrischool-net

  # Microsserviço de Login / Autenticação
  login:
    build: ./backend/login
    container_name: distrischool-login
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/distrischool_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres
    networks:
      - distrischool-net

  # Microsserviço de Gestão de Alunos
  aluno-service:
    build: ./backend/aluno-service
    container_name: distrischool-aluno-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/distrischool_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres
    networks:
      - distrischool-net

  # Microsserviço de Gestão de Professores
  professor-service:
    build: ./backend/professor-service
    container_name: distrischool-professor-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/distrischool_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres
    networks:
      - distrischool-net

  # Microsserviço de Registro de Presenças (Attendance Service)
  attendance-service:
    build: ./backend/attendance-service
    container_name: distrischool-attendance-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/distrischool_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - distrischool-net

  # Microsserviço API Gateway
  api-gateway:
    build: ./backend/api-gateway
    container_name: distrischool-api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
    depends_on:
      - login
      - aluno-service
      - professor-service
      - attendance-service
    networks:
      - distrischool-net

volumes:
  postgres_data:
  mongodb_data:

networks:
  distrischool-net:
    driver: bridge
