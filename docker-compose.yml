services:
  # Banco de Dados Relacional Principal
  postgres:
    image: postgres:15
    container_name: distrischool-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-distrischool_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - distrischool-net

  # Banco de Dados NoSQL (Opcional, listado na arquitetura para microsserviços específicos)
  mongodb:
    profiles: ["mongodb"]
    image: mongo:6
    container_name: distrischool-mongodb
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - distrischool-net

  # RabbitMQ (Com interface gráfica de gerenciamento na porta 15672)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: distrischool-rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-distrischool}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-distrischool-local}
    networks:
      - distrischool-net

  # Microsserviço de Login / Autenticação
  auth-service:
    build: ./backend/auth-service
    container_name: distrischool-auth-service
    ports:
      - "127.0.0.1:${AUTH_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-distrischool-development-secret-change-before-production-2026}
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/${AUTH_POSTGRES_DB:-auth_db}
      SPRING_DATASOURCE_USERNAME: ${AUTH_POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-distrischool}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-distrischool-local}
      NOTIFICATION_LOOKUP_KEY: ${NOTIFICATION_LOOKUP_KEY:-local-notification-lookup}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      SPRING_PROFILES_ACTIVE: ${AUTH_PROFILES:-local-notifications}
      SEED_PASSWORD: ${SEED_PASSWORD:-Universidade123!}
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - distrischool-net

  # Microsserviço de Gestão de Alunos
  aluno-service:
    build: ./backend/aluno-service
    container_name: distrischool-aluno-service
    ports:
      - "127.0.0.1:${ALUNO_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      JWT_SECRET: ${JWT_SECRET:-distrischool-development-secret-change-before-production-2026}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-distrischool_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-distrischool}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-distrischool-local}
      NOTIFICATION_LOOKUP_KEY: ${NOTIFICATION_LOOKUP_KEY:-local-notification-lookup}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - distrischool-net

  # Microsserviço de Gestão de Professores
  professor-service:
    build: ./backend/professor-service
    container_name: distrischool-professor-service
    ports:
      - "127.0.0.1:${PROFESSOR_PORT:-8083}:8083"
    environment:
      SERVER_PORT: 8083
      JWT_SECRET: ${JWT_SECRET:-distrischool-development-secret-change-before-production-2026}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-distrischool_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-distrischool}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-distrischool-local}
      NOTIFICATION_LOOKUP_KEY: ${NOTIFICATION_LOOKUP_KEY:-local-notification-lookup}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - distrischool-net

  # Microsserviço de Registro de Presenças (Attendance Service)
  attendance-service:
    build: ./backend/attendance-service
    container_name: distrischool-attendance-service
    ports:
      - "127.0.0.1:${ATTENDANCE_PORT:-8084}:8084"
    environment:
      SERVER_PORT: 8084
      JWT_SECRET: ${JWT_SECRET:-distrischool-development-secret-change-before-production-2026}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-distrischool_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-distrischool}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-distrischool-local}
      NOTIFICATION_LOOKUP_KEY: ${NOTIFICATION_LOOKUP_KEY:-local-notification-lookup}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - distrischool-net

  # Microsserviço de Gestão de Turmas e Horários
  turma-service:
    build: ./backend/turma-service
    container_name: distrischool-turma-service
    ports:
      - "127.0.0.1:${TURMA_PORT:-8085}:8085"
    environment:
      SERVER_PORT: 8085
      JWT_SECRET: ${JWT_SECRET:-distrischool-development-secret-change-before-production-2026}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-distrischool_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-distrischool}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-distrischool-local}
      NOTIFICATION_LOOKUP_KEY: ${NOTIFICATION_LOOKUP_KEY:-local-notification-lookup}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - distrischool-net

  # Microsserviço de Gestão de Notas (Nota Service)
  nota-service:
    build: ./backend/nota-service
    container_name: distrischool-nota-service
    ports:
      - "127.0.0.1:${NOTA_PORT:-8086}:8086"
    environment:
      SERVER_PORT: 8086
      JWT_SECRET: ${JWT_SECRET:-distrischool-development-secret-change-before-production-2026}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-distrischool_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-distrischool}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-distrischool-local}
      NOTIFICATION_LOOKUP_KEY: ${NOTIFICATION_LOOKUP_KEY:-local-notification-lookup}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - distrischool-net

  # Microsserviço API Gateway
  api-gateway:
    build: ./backend/api-gateway
    container_name: distrischool-api-gateway
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-distrischool-development-secret-change-before-production-2026}
    depends_on:
      - auth-service
      - aluno-service
      - professor-service
      - attendance-service
      - turma-service
      - nota-service
    networks:
      - distrischool-net

  auth-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-auth_db}
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - distrischool-net

volumes:
  auth_data:
  postgres_data:
  mongodb_data:

networks:
  distrischool-net:
    driver: bridge
